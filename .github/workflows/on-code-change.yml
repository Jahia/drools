# Build the project on every pull request. This workflow publishes nothing.
#
# The default build covers drools-core and drools-compiler, which are the two modules Jahia
# maintains and the only two carrying a Jahia version. The other modules sit behind the
# fullProfile and still inherit the upstream 6.0.0.Final parent.
name: On Code Change (PR)

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Module
    runs-on: ubuntu-latest
    container:
      image: jahia/cimg-mvn-cache:ga_cimg_openjdk_8.0.312-node
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'
      - name: Build with Maven
        run: mvn -s ./.github/maven.settings.xml -ntp -B verify --file pom.xml
