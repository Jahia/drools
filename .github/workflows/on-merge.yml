# Build the project and publish its snapshot to the Jahia Nexus, on every push to the
# maintained branch.
#
# One job runs the whole lifecycle. The build and the publish used to be two jobs, and the
# second one rebuilt everything the first had already built.
name: On merge to the maintained branch

on:
  push:
    branches:
      - '6.0.0.Final-jahia'
    tags-ignore:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish the snapshot
    runs-on: ubuntu-latest
    container:
      image: jahia/cimg-mvn-cache:ga_cimg_openjdk_8.0.312-node
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Set environment variables from parameters
        shell: bash
        run: |
          echo "NEXUS_USERNAME=${{ secrets.NEXUS_USERNAME }}" >> "$GITHUB_ENV"
          echo "NEXUS_PASSWORD=${{ secrets.NEXUS_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Deploy with Maven
        shell: bash
        run: mvn -s ./.github/maven.settings.xml -ntp -B deploy --file pom.xml

      - name: Report where the artifacts landed
        shell: bash
        run: |
          set -euo pipefail
          # actions/setup-java sets MAVEN_ARGS=-ntp, which hides every transfer line, so the
          # location is read from the project rather than from the Maven log. The help plugin is
          # pinned because older versions print nothing under -q.
          ev() {
            mvn -q -B -N -s ./.github/maven.settings.xml --file pom.xml \
              org.apache.maven.plugins:maven-help-plugin:3.4.0:evaluate \
              -Dexpression="$1" -DforceStdout
          }
          version="$(ev project.version)"
          case "$version" in
            *-SNAPSHOT) repository="$(ev project.distributionManagement.snapshotRepository.url)" ;;
            *)          repository="$(ev project.distributionManagement.repository.url)" ;;
          esac
          group="$(ev project.groupId | tr '.' '/')"
          for module in drools-core drools-compiler; do
            echo "::notice title=Snapshot published::${repository%/}/$group/$module/$version/"
          done
