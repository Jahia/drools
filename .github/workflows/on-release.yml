# Release from a GitHub pre-release.
#
# To release, create a GitHub pre-release whose tag is the version itself, for example
# 6.0.0.Final-jahia3. This workflow deletes the tag GitHub created, because the Maven release
# plugin creates the real one on the release commit.
name: Trigger Release creation

on:
  release:
    types: [prereleased]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  on-release:
    runs-on: ubuntu-latest
    steps:
      # Providing the SSH private key of a user in an admin group is what lets the release
      # commit bypass the pull request checks.
      - uses: actions/checkout@v5
        with:
          ref: 6.0.0.Final-jahia
          ssh-key: ${{ secrets.GH_SSH_PRIVATE_KEY_JAHIACI }}

      - name: Set environment variables from parameters
        shell: bash
        run: |
          echo "NEXUS_USERNAME=${{ secrets.NEXUS_USERNAME }}" >> "$GITHUB_ENV"
          echo "NEXUS_PASSWORD=${{ secrets.NEXUS_PASSWORD }}" >> "$GITHUB_ENV"

      # The release plugin pushes the release commit and the tag back to the branch.
      # https://github.com/webfactory/ssh-agent
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.GH_SSH_PRIVATE_KEY_JAHIACI }}

      - name: Delete the tag GitHub created for the release
        shell: bash
        run: |
          git config user.email 'jahia-ci@jahia.com'
          git config user.name 'Jahia CI'
          git fetch --all --tags
          git tag --delete '${{ github.event.release.tag_name }}' || true
          git push origin ':refs/tags/${{ github.event.release.tag_name }}'

      # actions/setup-java caches ~/.m2/repository itself, so the separate cache step is gone.
      - name: Set up JDK 1.8
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Compute the release and the next development version
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          release='${{ github.event.release.tag_name }}'

          # A Jahia version of this fork ends in -jahia<N>, so the next development version
          # raises N by one.
          case "$release" in
            *-jahia[0-9]*) ;;
            *)
              echo "::error::The tag $release does not end in -jahia<N>. Name the tag after the version, for example 6.0.0.Final-jahia3."
              exit 1
              ;;
          esac
          base="${release%-jahia*}"
          revision="${release##*-jahia}"
          next="${base}-jahia$((revision + 1))-SNAPSHOT"

          {
            echo "release=$release"
            echo "next=$next"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Release plan::$release, then $next"

      - name: Release with Maven
        shell: bash
        run: |
          set -euo pipefail
          SKIPS="-Dcheckstyle.skip=true -DskipLocalStaging=true -Dfindbugs.skip=true -Dmaven.javadoc.skip=true -Dgpg.skip=true"
          # shellcheck disable=SC2086
          mvn -ntp -B -s .github/maven.settings.xml -DdryRun=false $SKIPS \
            -Dtag='${{ steps.versions.outputs.release }}' \
            -DreleaseVersion='${{ steps.versions.outputs.release }}' \
            -DdevelopmentVersion='${{ steps.versions.outputs.next }}' \
            -DscmCommentPrefix='[skip ci] [maven-release-plugin] ' \
            -Darguments="$SKIPS" release:prepare
          # shellcheck disable=SC2086
          mvn -ntp -B -s .github/maven.settings.xml -DdryRun=false $SKIPS \
            -Darguments="$SKIPS" release:perform
